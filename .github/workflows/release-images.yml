name: Release images

on:
  push:
    branches: [main, devin/productionize-blastradius]
  workflow_dispatch:
    inputs:
      promotion:
        description: Enforce zero HIGH/CRITICAL findings before promotion (does not deploy)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified Trivy
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output trivy.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy.tar.gz' | sha256sum --check
          tar -xzf trivy.tar.gz trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan repository for secrets
        run: make secret-audit
      - name: Build local images
        run: |
          cp .env.example .env
          docker compose config --quiet
          make image
      - name: Verify migration and readiness with PostgreSQL
        run: |
          docker compose up -d --wait db
          docker compose run --rm migrate
          docker compose run --rm migrate
          docker compose up -d --wait app
          curl --fail --silent --show-error http://localhost:8000/health/ready
          docker compose exec -T app sh -c 'test "$(id -u)" = 10001 && test ! -w /app/alembic.ini'
          docker compose exec -T db sh -c 'test "$(id -u)" != 0 && test ! -e /usr/local/bin/gosu'
      - name: Record all findings and enforce image secret checks
        run: make container-audit
      - name: Enforce promotion vulnerability gate
        if: github.event_name == 'workflow_dispatch' && inputs.promotion
        run: make promotion-check
      - name: Preserve scan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-image-scans
          path: .local/audit/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
      - name: Stop local containers
        if: always()
        run: docker compose down
