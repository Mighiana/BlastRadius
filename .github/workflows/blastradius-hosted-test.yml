name: BlastRadius Hosted Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: blastradius-hosted-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BLASTRADIUS_REVISION: a72c04890640102b315506ab85e5f1ccbe91bb9f
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_NUMBER: ${{ github.event.pull_request.number }}

jobs:
  blast-radius:
    if: startsWith(github.head_ref, 'test/blastradius-hosted-')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    timeout-minutes: 15
    outputs:
      decision: ${{ steps.analysis.outputs.decision }}
      security_score_before: ${{ steps.analysis.outputs.security_score_before }}
      security_score_after: ${{ steps.analysis.outputs.security_score_after }}
      critical_paths_added: ${{ steps.analysis.outputs.critical_paths_added }}
      sensitive_resources_added: ${{ steps.analysis.outputs.sensitive_resources_added }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: terraform-repo
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install published analyzer
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv "$RUNNER_TEMP/blastradius-env"
          "$RUNNER_TEMP/blastradius-env/bin/python" -m pip install "git+https://github.com/Mighiana/BlastRadius.git@$BLASTRADIUS_REVISION"
      - name: Fetch candidate without checkout
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C "$GITHUB_WORKSPACE/terraform-repo" -c "http.extraHeader=AUTHORIZATION: basic $auth" fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
      - name: Analyze controlled Terraform change
        id: analysis
        working-directory: ${{ runner.temp }}
        run: |
          set +e
          "$RUNNER_TEMP/blastradius-env/bin/python" -I -m blastradius.cli \
            --github-action --repo "$GITHUB_WORKSPACE/terraform-repo" \
            --terraform-dir examples/hosted-pr --format summary --fail-on-review \
            --report-dir "$RUNNER_TEMP/blastradius-reports" \
            --github-output "$GITHUB_OUTPUT" --github-summary "$GITHUB_STEP_SUMMARY"
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: blastradius-hosted-test-report
          retention-days: 7
          path: ${{ runner.temp }}/blastradius-reports/
          if-no-files-found: warn
      - name: Post or update one PR comment
        if: always() && (steps.analysis.outputs.exit_code == '0' || steps.analysis.outputs.exit_code == '1')
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_REPOSITORY: ${{ github.repository }}
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/blastradius-env/bin/python" -I -m blastradius.github_pr \
            --repository "$PR_REPOSITORY" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" \
            --report-file "$RUNNER_TEMP/blastradius-reports/report.md"
      - name: Enforce analysis exit code
        if: always()
        env:
          ANALYSIS_EXIT: ${{ steps.analysis.outputs.exit_code }}
        working-directory: ${{ runner.temp }}
        run: |
          case "$ANALYSIS_EXIT" in
            0) exit 0 ;;
            1) echo "::error::Controlled change introduces a modeled critical path."; exit 1 ;;
            *) echo "::error::Analysis did not complete."; exit 2 ;;
          esac
