# BlastRadius CI for this repository.
#
# Candidate tests run with read-only permissions and no repository secrets.
# The Terraform gate separately runs the trusted base analyzer on candidate data.
#
# For the copy-paste workflow that guards *your* Terraform pull requests, see
# docs/github-action.yml
name: BlastRadius

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install verified actionlint
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output actionlint.tar.gz
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz' | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
      - name: Validate workflows and container configuration
        env:
          POSTGRES_PASSWORD: local-ci-validation-only
        run: |
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yml docs/github-action.yml
          sh -n scripts/container-entrypoint.sh
          bash -n scripts/verify-demo.sh
          cp .env.example .env
          docker compose config --quiet
          docker build --check .

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -e ".[server,ui,dev]" -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m pytest -o addopts='' -q scripts/test_release_*.py
      - run: make lint typecheck docs PY=python
      - name: Build installable wheel
        run: make wheel PY=python

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make frontend

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.19.0"
      - run: python -m pip install -e ".[server,ui,dev]" -r requirements.txt -r requirements-dev.txt
      - run: python -m pip_audit --skip-editable
      - run: npm --prefix web ci
      - run: npm --prefix web audit --audit-level=moderate

  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .

      - name: A risky change must fail the gate (expect exit 1)
        run: |
          set +e
          python -m blastradius.cli --before examples/safe --after examples/vulnerable --format pr
          code=$?
          set -e
          test "$code" -eq 1 || { echo "::error::expected exit 1, got $code"; exit 1; }

      - name: A safe change must pass the gate (expect exit 0)
        run: python -m blastradius.cli --before examples/safe --after examples/safe

      - name: Remediated config must pass the gate (expect exit 0)
        run: python -m blastradius.cli --before examples/vulnerable --after examples/safe

      - name: Terraform plan JSON mode must fail the gate (expect exit 1)
        run: |
          set +e
          python -m blastradius.cli --plan examples/plans/ssh_open_plan.json
          code=$?
          set -e
          test "$code" -eq 1 || { echo "::error::expected exit 1, got $code"; exit 1; }

  terraform-pr-gate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TERRAFORM_DIR: examples/safe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install trusted analyzer
        working-directory: trusted
        run: python -m pip install .
      - name: Fetch candidate objects without checkout
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraHeader=AUTHORIZATION: basic $auth" fetch --no-tags origin "refs/pull/$PR_NUMBER/head"
      - name: Analyze Terraform pull request
        id: analysis
        working-directory: trusted
        run: |
          set +e
          python -m blastradius.cli --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --terraform-dir "$TERRAFORM_DIR" --format pr > ../blastradius-report.md
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          python -m blastradius.cli --repo . --base "$BASE_SHA" --head "$HEAD_SHA" --terraform-dir "$TERRAFORM_DIR" --format sarif > ../blastradius.sarif
          cat ../blastradius-report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: blastradius-security-report
          retention-days: 7
          path: |
            blastradius-report.md
            blastradius.sarif
      - name: Enforce merge gate
        if: always()
        env:
          ANALYSIS_EXIT: ${{ steps.analysis.outputs.exit_code }}
        run: |
          case "$ANALYSIS_EXIT" in
            0) exit 0 ;;
            1) echo "::error::BlastRadius blocked this change."; exit 1 ;;
            *) echo "::error::Analysis did not complete."; exit 2 ;;
          esac
