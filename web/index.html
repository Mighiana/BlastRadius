<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1018" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('br-theme');
          var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
          if (light) {
            document.documentElement.dataset.theme = 'light';
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#e7ecf4');
          }
        } catch (e) { /* storage or media query unavailable: keep the dark default */ }
      })();
    </script>
    <meta name="description" content="See what your Terraform change makes reachable. Compare modeled attack paths before merge with BlastRadius." />
    <title>BlastRadius — Know before you merge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
