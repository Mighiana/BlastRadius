[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius"
dynamic = ["version"]
description = "Attack-path diff for Terraform pull requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx==3.6.1",
  "python-hcl2==8.1.4",
  "PyYAML==6.0.3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "pyvis==0.3.2"]
dev = ["pytest>=8.4.2,<10"]

[project.scripts]
blastradius = "blastradius.cli:main"
blastradius-comment = "blastradius.github_pr:main"

[project.urls]
Repository = "https://github.com/Mighiana/BlastRadius"

[tool.setuptools.dynamic]
version = {attr = "blastradius.__version__"}

[tool.setuptools.packages.find]
include = ["blastradius", "blastradius.*"]
exclude = ["tests", "examples"]

[tool.setuptools]
include-package-data = false
