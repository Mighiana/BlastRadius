[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blastradius"
dynamic = ["version"]
description = "Attack-path diff for Terraform pull requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "networkx==3.6.1",
  "python-hcl2==8.1.4",
  "PyYAML==6.0.3",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40,<2", "pyvis==0.3.2"]
dev = ["pytest>=8.4.2,<10", "httpx==0.28.1", "ruff==0.12.12", "mypy==1.17.1"]
server = [
  "fastapi==0.136.3",
  "starlette==1.3.1",
  "uvicorn==0.35.0",
  "SQLAlchemy==2.0.43",
  "alembic==1.16.5",
  "psycopg[binary]==3.2.10",
  "Authlib==1.6.12",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "stripe==12.5.1",
]

[project.scripts]
blastradius = "blastradius.cli:main"
blastradius-comment = "blastradius.github_pr:main"

[project.urls]
Repository = "https://github.com/Mighiana/BlastRadius"

[tool.setuptools.dynamic]
version = {attr = "blastradius.__version__"}

[tool.setuptools.packages.find]
include = ["blastradius", "blastradius.*"]
exclude = ["tests", "examples"]

[tool.setuptools]
include-package-data = false
